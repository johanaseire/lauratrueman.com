---
layout: default
---

<style>
  .artist-header {
    text-align: center;
    margin: 2rem 0 3rem;
  }
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 2.5rem;
    padding: 0 1rem;
  }
  .artwork-card {
    background: #fff;
    border-radius: 4px;
    overflow: hidden;
  }
  .artwork-card img {
    width: 100%;
    height: 320px;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
  }
  .artwork-card img:hover {
    transform: scale(1.02);
  }
  .artwork-info {
    padding: 1rem 0;
  }
  .artwork-title {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0;
  }
  .artwork-meta {
    font-size: 0.9rem;
    color: #666;
    margin-top: 0.2rem;
  }
  .status-badge {
    display: inline-block;
    font-size: 0.75rem;
    padding: 2px 8px;
    background: #f0f0f0;
    border-radius: 12px;
    margin-top: 0.5rem;
  }
</style>

<div class="artist-header">
  <h1>{{ site.title }}</h1>
  <p>{{ site.description }}</p>
</div>

<div class="gallery-grid">
  {% for item in site.data.gallery %}
    <div class="artwork-card">
      <img src="{{ item.image | relative_url }}" alt="{{ item.title }}" loading="lazy" />
      <div class="artwork-info">
        <h2 class="artwork-title">{{ item.title }} ({{ item.year }})</h2>
        <div class="artwork-meta">{{ item.medium }}</div>
        <span class="status-badge">{{ item.status }}</span>
      </div>
    </div>
  {% endfor %}
</div>
